[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "joseon-rag-journal-educational"
version = "0.1.0"
description = "Evidence-first RAG for article-oriented historical records"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0"]
tokens = ["tiktoken>=0.7"]
speech = ["kokoro>=0.9.4", "soundfile", "faster-whisper>=1.1"]

[project.scripts]
joseon-rag = "joseon_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
