<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Historical evidence inspector</title>
<style>body{margin:0;font:16px system-ui;background:#f2eee5;color:#192b36}header{background:#132d39;color:#fff;padding:24px 5vw}header p{color:#c6d7d4}main{max-width:1250px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(350px,1fr) minmax(350px,1fr);gap:18px}section{background:white;border:1px solid #d2d9d6;padding:20px;border-radius:8px}h1{margin:0}h2{font-size:19px}label{display:block;margin:12px 0 4px;font-weight:650}input,select,textarea,button{font:inherit}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #9daeb1;border-radius:5px}textarea{min-height:85px}button{background:#165d65;color:white;border:0;border-radius:5px;padding:10px 17px;cursor:pointer}button:disabled{opacity:.5}.muted{color:#64777b;font-size:13px}.evidence{border-top:1px solid #dde2dc;padding:13px 0}.evidence small{display:block;color:#536a6e}.evidence pre{white-space:pre-wrap;font:14px/1.5 system-ui;max-height:240px;overflow:auto;background:#f7f8f4;padding:12px}#answer{white-space:pre-wrap}.trace{background:#edf2ee;padding:12px;overflow-wrap:anywhere}a{color:#17616b}#avatar-stage{display:none}#avatar-stage.active{display:block}#avatar-canvas{width:100%;height:280px} @media(max-width:850px){main{display:block}section{margin-bottom:15px}}</style></head><body>
<header><h1>Historical evidence inspector</h1><p>Article-preserving retrieval · date filters · source-linked answers</p><div id="corpus" class="muted"></div></header>
<main><section><form id="ask"><label for="query">Question</label><textarea id="query" required placeholder="Ask about a person, event, and approximate date">What scholarly policy was discussed in 1420?</textarea><label for="budget">Evidence token budget</label><input id="budget" type="number" min="50" max="16000" value="2400"><label for="rewrite">Query regeneration</label><select id="rewrite"><option value="rule">Rule and event aliases</option><option value="none">None</option><option value="endpoint">Configured model endpoint</option></select><label for="generation">Answer</label><select id="generation"><option value="extractive">Extractive source sentences</option><option value="endpoint">Configured grounded model endpoint</option></select><p><button>Search evidence</button></p></form><div id="avatar-stage"><div id="avatar-canvas"></div><button id="play" type="button">Speak answer</button> <span id="motion"></span></div><h2>Answer</h2><div id="answer" aria-live="polite">Ask a question to inspect the pipeline.</div><div id="citations"></div></section>
<section><h2>Retrieval trace</h2><div id="trace" class="trace">No query yet.</div><h2>Selected full articles</h2><div id="evidence"></div></section></main>
<script type="module">const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let last;fetch('/api/corpus').then(r=>r.json()).then(x=>{$('#corpus').textContent=`${x.collection_label || 'Article records'} · ${x.articles} records · ${x.backend}`;const q=$('#query');if(x.suggested_query&&q.value===q.defaultValue)q.value=x.suggested_query});$('#ask').onsubmit=async e=>{e.preventDefault();$('#answer').textContent='Retrieving…';const body={query:$('#query').value,token_budget:Number($('#budget').value),rewrite:$('#rewrite').value,generation:$('#generation').value};try{let r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});last=await r.json();if(!r.ok)throw Error(last.error);$('#answer').textContent=last.answer;$('#citations').innerHTML=last.citations.map(c=>`<p><a target="_blank" rel="noopener noreferrer" href="${esc(c.url)}">${esc(c.label)}</a></p>`).join('');let t=last.trace;$('#trace').innerHTML=`<b>Original:</b> ${esc(t.original_query)}<br><b>Rewritten:</b> ${esc(t.rewritten_query)}<br><b>Date:</b> ${esc(JSON.stringify(t.date_filter))}<br><b>Budget:</b> ${t.estimated_tokens}/${t.token_budget} estimated tokens · ${t.evidence.length} articles`;$('#evidence').innerHTML=t.evidence.map(x=>`<div class="evidence"><b>${esc(x.article.title||x.article.id)}</b><small>${esc(x.article.id)} · ${esc([x.article.year,x.article.month,x.article.day].filter(Boolean).join('-'))} · similarity ${x.similarity} · rerank ${x.rerank_score} · ${x.estimated_tokens} tokens</small><pre>${esc(x.article.text)}</pre><a href="${esc(x.article.source_url)}" target="_blank" rel="noopener noreferrer">Source record</a></div>`).join('');if(last.agent){$('#avatar-stage').classList.add('active');$('#motion').textContent=`${last.agent.events.length} timed utterances`;}}catch(err){$('#answer').textContent=err.message;}};$('#play').onclick=()=>{if(!last?.agent)return;speechSynthesis.cancel();for(const e of last.agent.events){setTimeout(()=>{let u=new SpeechSynthesisUtterance(e.text);speechSynthesis.speak(u);$('#motion').textContent=`Gesture: ${e.motion}`;},e.start*1000)}};</script></body></html>
